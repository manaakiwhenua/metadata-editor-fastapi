# CI for metadata-editor-fastapi. Builds the image via the central reusable
# workflow (manaakiwhenua/github-workflows) -> prod Harbor. The image is consumed
# by the `metadata-editor` app deploy (one app, two repos -> IMAGE_PROJECT).
# Fork-only (CICD-ADR-008): downstream.
#
# Image lands at: registry.landcareresearch.co.nz/mwlr-private/metadata-editor-fastapi:<build_id>
#
# PREREQUISITES (not yet configured - MT-35):
#   - Repo variable: HARBOR_USERNAME; secrets: HARBOR_TOKEN, REGISTRY_CA_CERT
#   - A self-hosted `tak-k8s-ci` runner
#   - Dockerfile on `downstream` (fastapi PR #2 / MT-34)
#   - Multi-repo deploy wiring (this image + the web image -> one app) is an open
#     item; the deploy job lives on the web repo.
name: CI
on:
  push:
    branches: [downstream]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: manaakiwhenua/github-workflows/.github/workflows/docker-build.yml@main
    with:
      bake_file: docker-bake.hcl
      bake_target: default
      image_name: metadata-editor-fastapi
      image_namespace: mwlr-private
      runs_on: tak-k8s-ci
      push: true
      harbor_username: ${{ vars.HARBOR_USERNAME }}
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
      REGISTRY_CA_CERT: ${{ secrets.REGISTRY_CA_CERT }}
